
data:
  train_dir: "/kaggle/input/datasets/magdhbc123b/galaxeye-dataset/train/train"
  val_dir:   "/kaggle/input/datasets/magdhbc123b/galaxeye-dataset/val/val"
  test_dir:  "/kaggle/input/datasets/magdhbc123b/galaxeye-dataset/test/test"
  image_size: 256
  num_classes: 1

training:
  epochs: 30
  batch_size: 8 
  learning_rate: 0.0001
  min_lr: 0.000001
  weight_decay: 0.0001
  optimizer: "adamw"
  random_seed: 42
  warmup_epochs: 3
  gradient_clip: 1.0

loss:
  focal_weight: 0.4
  dice_weight:  0.4
  tversky_weight: 0.2
  focal_alpha:  0.80
  focal_gamma:  2.5
  tversky_alpha: 0.3   # weight on FP
  tversky_beta:  0.7   # weight on FN (recall-biased)
  label_smoothing: 0.05

model:
  encoder: "efficientnet_b4"
  pretrained: true
  deep_supervision: true
  ds_weight: 0.3       # weight for auxiliary decoder outputs

checkpoint:
  save_dir: "/kaggle/working/checkpoints"
  best_metric: "f1"
