# Model configuration
model:
  backbone: efficientnet_b4
  pretrained: true
  in_channels_eo: 3
  in_channels_sar: 1
  num_classes: 1

# Data configuration
data:
  image_size: 256
  batch_size: 8
  num_workers: 2
  sar_mean: 2.9777
  sar_std: 1.7104
  eo_mean: [0.485, 0.456, 0.406]
  eo_std: [0.229, 0.224, 0.225]

# Training configuration
training:
  epochs: 30
  patience: 10
  learning_rate: 0.0001
  weight_decay: 0.01
  max_lr: 0.001
  warmup_pct: 0.1
  grad_clip: 1.0
  seed: 42

# Loss configuration
loss:
  focal_weight: 0.4
  dice_weight: 0.4
  tversky_weight: 0.2
  focal_alpha: 0.8
  focal_gamma: 2.0
  tversky_alpha: 0.3
  tversky_beta: 0.7
  aux_loss_weight: 0.3

# Augmentation
augmentation:
  train:
    - RandomCrop: 256
    - HorizontalFlip: 0.5
    - VerticalFlip: 0.5
    - RandomRotate90: 0.5
  val:
    - CenterCrop: 256

# Evaluation
evaluation:
  threshold: 0.5
  tta_folds: 10
